<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personenrettung – Ablauf - Ausbildungsprüfung Technischer Einsatz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container app-container-breit">
        <h1>Personenrettung – Ablauf</h1>
        <div class="flashcard flashcard-lang" onclick="flipCard()">
            <div class="card-content front" id="cardQuestion">
                <p class="card-label" id="zustaendigText"></p>
                <p id="stationText">Station wird hier angezeigt.</p>
                <h3>Lage</h3>
                <p id="lageText"></p>
            </div>
            <div class="card-content back" id="cardAnswer">
                <h3>Schutzausrüstung</h3>
                <p id="schutzText"></p>
                <h3>Durchführung</h3>
                <p id="ablaufText"></p>
                <h3>Erklärung des Truppführers</h3>
                <p id="erklaerungText"></p>
                <h3>Benötigtes Material</h3>
                <p id="materialText"></p>
            </div>
        </div>
        <div class="button-container">
            <button onclick="markCorrect()">Richtig</button>
            <button onclick="markIncorrect()">Falsch</button>
            <button onclick="getNextQuestion()">Nächste Station</button>
            <button onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script src="../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: 'daten/personenrettung_ablauf.json',
            subject: 'Die Stationen der Personenrettung',
            renderer: FF.renderers.fields({
                front: {
                    zustaendigText: function (s) { return s.zustaendig; },
                    stationText: function (s) { return s.station; },
                    lageText: function (s) { return s.lage; }
                },
                back: {
                    schutzText: function (s) { return s.schutzausruestung; },
                    ablaufText: function (s) { return s.durchfuehrung; },
                    erklaerungText: function (s) { return s.erklaerung; },
                    materialText: function (s) { return s.material; }
                }
            })
        });
    </script>
</body>
</html>
