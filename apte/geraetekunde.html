<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerätekunde - Ausbildungsprüfung Technischer Einsatz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <h1>Gerätekunde</h1>
        <div class="flashcard flashcard-lang" onclick="flipCard()">
            <div class="card-content front" id="cardQuestion">
                <p id="nameText">Gerät wird hier angezeigt.</p>
            </div>
            <div class="card-content back" id="cardAnswer">
                <h3>Raum</h3>
                <p id="raumText"></p>
                <h3>Verwendungszweck</h3>
                <p id="zweckText"></p>
            </div>
        </div>
        <div class="button-container">
            <button class="btn-yes" onclick="markCorrect()">Richtig</button>
            <button class="btn-no" onclick="markIncorrect()">Falsch</button>
            <button class="btn-next" onclick="getNextQuestion()">Nächstes Gerät</button>
            <button class="btn-reset" onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script src="../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: 'daten/geraete.json',
            subject: 'Die Geräte',
            /* Nur Geräte mit gepflegter Raumangabe abfragen. Damit erledigt das
               Ausfüllen der JSON-Datei zugleich das Aussortieren jener Geräte,
               die im eigenen Fahrzeug gar nicht vorhanden sind. */
            filter: function (geraet) {
                return typeof geraet.raum === 'string' && geraet.raum.trim() !== '';
            },
            emptyMessage: 'In daten/geraete.json ist noch kein Raum eingetragen. ' +
                'Trage bei den Geräten eures Fahrzeuges den Raum ein – Geräte ohne ' +
                'Raumangabe werden übersprungen.',
            renderer: FF.renderers.fields({
                front: {
                    nameText: function (geraet) { return geraet.name; }
                },
                back: {
                    raumText: function (geraet) { return geraet.raum; },
                    zweckText: function (geraet) { return geraet.verwendungszweck; }
                }
            })
        });
    </script>
</body>
</html>
