<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positionen bei der Durchführung - Ausbildungsprüfung Technischer Einsatz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container app-container-breit">
        <h1>Positionen bei der Durchführung</h1>
        <div class="flashcard flashcard-lang" onclick="flipCard()">
            <div class="card-content front" id="cardQuestion">
                <p class="card-label" id="kombinationText"></p>
                <p id="positionText">Position wird hier angezeigt.</p>
            </div>
            <div class="card-content back" id="cardAnswer">
                <p id="taetigkeitText"></p>
            </div>
        </div>
        <div class="button-container">
            <button class="btn-yes" onclick="markCorrect()">Richtig</button>
            <button class="btn-no" onclick="markIncorrect()">Falsch</button>
            <button class="btn-next" onclick="getNextQuestion()">Nächste Position</button>
            <button class="btn-reset" onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script src="../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: 'daten/positionen_durchfuehrung.json',
            subject: 'Die Positionen',
            renderer: FF.renderers.fields({
                front: {
                    kombinationText: function (p) { return p.kombination; },
                    positionText: function (p) { return p.position; }
                },
                back: {
                    taetigkeitText: function (p) { return p.taetigkeit; }
                }
            })
        });
    </script>
</body>
</html>
