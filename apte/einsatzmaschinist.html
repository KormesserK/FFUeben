<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatzmaschinist - Ausbildungsprüfung Technischer Einsatz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container app-container-breit">
        <h1>Einsatzmaschinist</h1>
        <div class="flashcard flashcard-lang" onclick="flipCard()">
            <div class="card-content front" id="cardQuestion">
                <p id="geraetText">Aggregat wird hier angezeigt.</p>
                <p class="card-label" id="hinweisText"></p>
            </div>
            <div class="card-content back" id="cardAnswer">
                <h3>Erklärung</h3>
                <p id="erklaerungText"></p>
                <h3>Inbetriebnahme</h3>
                <p id="inbetriebText"></p>
                <h3>Außerbetriebnahme</h3>
                <p id="ausserbetriebText"></p>
            </div>
        </div>
        <div class="button-container">
            <button class="btn-yes" onclick="markCorrect()">Richtig</button>
            <button class="btn-no" onclick="markIncorrect()">Falsch</button>
            <button class="btn-next" onclick="getNextQuestion()">Nächstes Aggregat</button>
            <button class="btn-reset" onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script src="../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: 'daten/einsatzmaschinist.json',
            subject: 'Die Aggregate und Geräte',
            renderer: FF.renderers.fields({
                front: {
                    geraetText: function (g) { return g.geraet; },
                    hinweisText: function (g) { return g.hinweis || null; }
                },
                back: {
                    erklaerungText: function (g) { return g.erklaerung; },
                    inbetriebText: function (g) { return g.inbetriebnahme; },
                    ausserbetriebText: function (g) { return g.ausserbetriebnahme; }
                }
            })
        });
    </script>
</body>
</html>
