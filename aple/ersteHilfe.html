<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erste Hilfe - Ausbildungsprüfung Löscheinsatz</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <h1>Erste Hilfe - Karteikarten</h1>
        <div class="flashcard" onclick="flipCard()">
            <div class="card-content">
                <p id="cardText">Klicke auf die Karte, um die Frage zu sehen.</p>
            </div>
        </div>
        <div class="button-container">
            <button class="btn-yes" onclick="markCorrect()">Richtig</button>
            <button class="btn-no" onclick="markIncorrect()">Falsch</button>
            <button class="btn-next" onclick="getNextQuestion()">Nächste Frage</button>
            <button class="btn-reset" onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script src="../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: 'ersteHilfeData.json',
            renderer: FF.renderers.singleText('cardText'),
            subject: 'Die Erste-Hilfe-Fragen'
        });
    </script>
</body>
</html>
