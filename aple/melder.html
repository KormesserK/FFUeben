<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melder-Karteikarten</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app-container">
        <h1>Melder-Karteikarten</h1>
        <div class="flashcard">
            <div class="card-content front" id="cardImage">
                <img id="imageContent" src="" alt="Bildkarte" style="max-width:100%; height:auto;">
            </div>
        </div>
        <button class="btn-next" onclick="getNextImage()">Nächstes Bild</button>
    </div>
    <script src="../shared/ff-core.js"></script>
    <script>
        (function () {
            var images = [];
            var index = 0;

            window.getNextImage = function () {
                if (images.length === 0) {
                    FF.showStatus('Es sind keine Bilder verfügbar.', 'error');
                    return;
                }
                document.getElementById('imageContent').src = images[index];
                index = (index + 1) % images.length;
            };

            FF.watchImages('Ein Melder-Bild konnte nicht geladen werden');
            FF.showStatus('Die Bilder werden geladen …', 'info');

            FF.loadJson('melder.json')
                .then(function (data) {
                    images = (Array.isArray(data) ? data : [])
                        .map(function (item) { return item.imageUrl; })
                        .filter(Boolean);
                    if (images.length === 0) {
                        throw new Error('Keine Bilder in melder.json');
                    }
                    FF.clearStatus();
                    window.getNextImage();
                })
                .catch(function (error) {
                    FF.reportError(error, 'Die Melder-Bilder konnten nicht geladen werden.');
                });
        }());
    </script>
</body>
</html>
