<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE20 - Rechtliche und organisatorische Grundlagen</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="app-container">
        <h1>RE20 - Rechtliche und organisatorische Grundlagen</h1>
        <div class="flashcard" onclick="flipCard()">
            <div class="card-content front" id="cardQuestion">
                <p id="questionText">Frage wird hier angezeigt.</p>
            </div>
            <div class="card-content back" id="cardAnswer">
                <p id="answerText">Antwort wird hier angezeigt.</p>
            </div>
        </div>
        <div class="button-container">
            <button class="btn-yes" onclick="markCorrect()">Richtig</button>
            <button class="btn-no" onclick="markIncorrect()">Falsch</button>
            <button class="btn-next" onclick="getNextQuestion()">Nächste Frage</button>
            <button class="btn-reset" onclick="resetGame()">Neues Spiel</button>
        </div>
    </div>
    <script src="../../shared/ff-core.js"></script>
    <script src="../../shared/ff-flashcards.js"></script>
    <script>
        FF.flashcards.start({
            source: '../data/re20_flashcards_detailed.json',
            renderer: FF.renderers.questionAnswer(),
            subject: 'Die Fragen zu RE20'
        });
    </script>
</body>
</html>
